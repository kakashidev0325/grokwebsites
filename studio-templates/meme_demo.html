<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meme generator</title>
<style>
body{margin:0;background:#101014;color:#f6f3ee;font-family:system-ui,sans-serif}
header{padding:28px 28px 8px}
h1{margin:0 0 6px;font-size:2rem}
p{margin:0;color:#c8c2b8}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding:18px 28px 48px}
figure{margin:0;background:#1b1b22;border-radius:14px;overflow:hidden}
img{width:100%;height:auto;display:block;background:#0c0c10}
figcaption{padding:8px 10px;font-size:13px;color:#d9d3c8}
</style>
</head>
<body>
<header>
  <h1>Meme scenes</h1>
  <p id="meta">Rendering…</p>
</header>
<div class="grid" id="grid"></div>
<script src="app_meme/meme_gen.js"></script>
<script>
function mulberry32(a){return function(){var t=a+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296}}
var logo=new Image();
logo.onload=function(){
  var palette=MemeGen.extractPalette(logo,null);
  var grid=document.getElementById('grid');
  MemeGen.SCENES.forEach(function(scene,i){
    [[1080,1080,'1080 square'],[1600,900,'1600×900']].forEach(function(sz,k){
      var rendered=MemeGen.renderMeme({
        W:sz[0], H:sz[1], logo:logo, name:'Bonkle', ticker:'BONKLE', palette:palette,
        rng:mulberry32(1000+i*17+k), scene:scene, layout:k?'rail-right':'center',
        caption:{a:'WHEN $BONKLE', b:k?'WIDE FRAME':'HITS DIFFERENT'}
      });
      var fig=document.createElement('figure');
      var canvas=rendered.canvas;
      canvas.style.width='100%'; canvas.style.height='auto';
      canvas.setAttribute('aria-label', scene.id+' '+sz[2]);
      var cap=document.createElement('figcaption');
      cap.textContent=scene.id+' · '+sz[2];
      fig.appendChild(canvas); fig.appendChild(cap); grid.appendChild(fig);
    });
  });
  var check=MemeGen.validateAllCaptions({logo:logo,name:'Bonkle',ticker:'BONKLE',palette:palette});
  document.getElementById('meta').textContent=MemeGen.sceneCount()+' scenes · palette '+palette.prim+' / '+palette.sec+' · captions '+(check.ok?'fit':'FAILED '+check.fails.length);
};
logo.src='sample/logo.png';
</script>
</body>
</html>
